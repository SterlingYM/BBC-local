[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bbclocal"
version = "0.1.0"
description = "Fast local re-implementation of SNANA's BBC fit (SALT2mu) for one common configuration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.12", "pandas>=1.5", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
bbclocal = "bbclocal.cli:main"
bbclocal-extract = "bbclocal.extract:main"

[tool.setuptools]
packages = ["bbclocal"]
